# SearXNG для Knowledge Engine (v0.6/v0.7)
# https://docs.searxng.org/admin/settings/settings.html

use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - duckduckgo
      - github
      - hackernews
      - stackoverflow
      - arxiv
      - google scholar

server:
  secret_key: "knowledge-engine-searxng-dev-secret-change-in-prod"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0

engines:
  # === WEB / PRACTICAL SEARCH ENGINES ===
  - name: google
    disabled: false
    weight: 1.2
    timeout: 6.0

  - name: bing
    disabled: false
    weight: 1.0
    timeout: 5.0

  - name: duckduckgo
    disabled: false
    weight: 1.0
    timeout: 5.0

  # === IT / COMMUNITY ENGINES ===
  - name: github
    disabled: false
    weight: 0.9

  - name: hackernews
    disabled: false
    weight: 0.8

  - name: stackoverflow
    disabled: false
    weight: 0.9

  # === ACADEMIC ENGINES ===
  - name: arxiv
    disabled: false
    weight: 1.0

  - name: google scholar
    disabled: false
    weight: 1.0
