# Опциональный dev API в Docker (Ollama на хосте через host.docker.internal).
# Рекомендуемый dev: ./knowledge_engine/scripts/dev-native.sh (uvicorn на macOS).

services:
  knowledge-api-dev:
    extends:
      file: docker-compose.yml
      service: knowledge-api
    container_name: ke-api-dev
    profiles:
      - dev
    environment:
      KE_API_RELOAD: "true"
    stdin_open: true
    tty: true
    develop:
      watch:
        - path: ./knowledge_engine/src/entrypoints/api
          action: sync
          target: /app/knowledge_engine/src/entrypoints/api
        - path: ./knowledge_engine/src/app
          action: sync
          target: /app/knowledge_engine/src/app
        - path: ./knowledge_engine/src/legacy/graph
          action: sync
          target: /app/knowledge_engine/src/legacy/graph
        - path: ./knowledge_engine/services
          action: sync
          target: /app/knowledge_engine/services
        - path: ./knowledge_engine/src/legacy/nodes
          action: sync
          target: /app/knowledge_engine/src/legacy/nodes
        - path: ./knowledge_engine/src/shared
          action: sync
          target: /app/knowledge_engine/src/shared
        - path: ./knowledge_engine/src/adapters
          action: sync
          target: /app/knowledge_engine/src/adapters
        - path: ./knowledge_engine/src/domains
          action: sync
          target: /app/knowledge_engine/src/domains
        - path: ./knowledge_engine/src/core
          action: sync
          target: /app/knowledge_engine/src/core
        - path: ./knowledge_engine/src/config
          action: sync
          target: /app/knowledge_engine/src/config
        - path: ./knowledge_engine/llm.py
          action: sync
          target: /app/knowledge_engine/llm.py
        - path: ./knowledge_engine/llm_locale.py
          action: sync
          target: /app/knowledge_engine/llm_locale.py
        - path: ./knowledge_engine/requirements.txt
          action: rebuild
